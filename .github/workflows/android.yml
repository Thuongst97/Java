name: Spendly Android CI

on:
  push:
    paths:
      - "final-project/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "final-project/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: final-project/Spendly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK, run unit tests, compile instrumented tests
        run: ./gradlew --stacktrace assembleDebug testDebugUnitTest assembleDebugAndroidTest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: final-project/Spendly/app/build/reports/tests/
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: spendly-debug-apk
          path: final-project/Spendly/app/build/outputs/apk/debug/*.apk
